<!doctype html>
<html>
  <head>
    <title><%= productName %></title>

    <meta charset="utf-8" />
    <meta name="description" content="<%= productDescription %>" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />
    <meta
      name="viewport"
      content="user-scalable=no, initial-scale=1, maximum-scale=1, minimum-scale=1, width=device-width<% if (ctx.mode.cordova || ctx.mode.capacitor || ctx.mode.pwa) { %>, viewport-fit=cover<% } %>"
    />

    <meta name="theme-color" content="#12151c" />
    <link rel="icon" type="image/svg+xml" href="icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
    <link rel="icon" href="favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <% if (ctx.mode.pwa) { %>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Артефактор" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <% } %>
  </head>
  <body>
    <!-- quasar:entry-point -->
  </body>
</html>
